{% extends "base.html" %}
{% block title %}Cars{% endblock %}
{% block pagename %}cars{% endblock %}
{% block content %}
<section class="wrap">
  <h1 class="pagehead">Choose a car</h1>
  <form class="search panel-search" id="filters">
    <label>Pick-up<input type="date" id="start" required></label>
    <label>Return<input type="date" id="end" required></label>
    <label>Car type<select id="type"><option value="">Any</option><option>Hatchback</option><option>Sedan</option><option>SUV</option><option>Van</option></select></label>
    <label>Seats<select id="seats"><option value="">Any</option><option value="5">5+</option><option value="7">7+</option><option value="10">10+</option></select></label>
    <label>Max price / day<select id="maxp"><option value="">Any</option><option value="2000">Rs 2,000</option><option value="3000">Rs 3,000</option><option value="4500">Rs 4,500</option></select></label>
  </form>
  <div class="grid" id="cars"></div>
</section>
{% endblock %}
